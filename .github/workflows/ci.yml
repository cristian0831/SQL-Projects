name: CI

on:
  push:
    branches: [main]
    paths: ["SQL/store_analysis/**"]
  pull_request:
    branches: [main]
    paths: ["SQL/store_analysis/**"]

defaults:
  run:
    working-directory: SQL/store_analysis

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: SQL/store_analysis/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -v
