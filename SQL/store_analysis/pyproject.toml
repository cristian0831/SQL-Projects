[project]
name = "superstoreproject"
version = "0.1.0"
requires-python = ">=3.9"

[tool.setuptools]
packages = ["src"]

[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: exercises the real committed db/superstore.db (schema/data smoke checks)",
]
